# Nium design-system theme — values are the light tokens from
# ~/Documents/vscode/nium-design-system/tokens.css. Don't invent colors here;
# change the tokens there and mirror them.
[theme]
primaryColor            = "#7461D4"   # --accent (nium-purple-l)
backgroundColor         = "#f5f5f7"   # --bg-page
secondaryBackgroundColor= "#ffffff"   # --bg-surface
textColor               = "#1d1d1f"   # --text-1
linkColor               = "#7461D4"
borderColor             = "#e1e1e6"   # ≈ --line (rgba(0,0,0,.08) on white)
dataframeBorderColor    = "#e1e1e6"
showWidgetBorder        = true
baseRadius              = "12px"      # --radius-md
font     = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
codeFont = "'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace"

[browser]
gatherUsageStats = false
