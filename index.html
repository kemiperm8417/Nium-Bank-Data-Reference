<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bank Reference Data</title>
  <!--
    GitHub Pages build: runs the same Streamlit app entirely in the browser via
    stlite (Streamlit on WebAssembly). Nothing runs on GitHub's servers — the
    Python executes on the visitor's machine, which is why it can reach the
    VPN-only Nium API. First load downloads ~30 MB and takes ~30-60 s.
  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
  <style>
    /* Boot splash styled with the Nium design-system tokens (light). */
    html, body { margin: 0; background: #f5f5f7; color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    #boot { max-width: 560px; margin: 72px auto; padding: 22px; background: #fff;
      border: 1px solid rgba(0,0,0,0.08); border-radius: 16px;
      box-shadow: 0 1px 2px rgba(11,14,88,0.04), 0 1px 1px rgba(11,14,88,0.03); }
    #boot h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px; }
    #boot p { font-size: 13px; line-height: 1.55; color: #6e6e73; margin: 0; }
    #boot .bar { height: 4px; border-radius: 999px; background: #ebebed; margin: 16px 0 0; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 40%; background: #7461D4; border-radius: 999px;
      animation: slide 1.2s cubic-bezier(0.25,0.1,0.25,1) infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
  </style>
</head>
<body>
  <div id="root">
    <div id="boot">
      <h1>Bank Reference Data</h1>
      <p>Loading the Python runtime into your browser (about 30 MB, cached after the first
      visit). This page must be opened from a machine on the Nium network/VPN.</p>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
    mount(
      {
        requirements: ["openpyxl", "pandas"],
        entrypoint: "app.py",
        files: {
          "app.py":     { url: "./app.py" },
          "refdata.py": { url: "./refdata.py" },
        },
        streamlitConfig: {
          "client.toolbarMode": "viewer",
          // Nium design-system tokens (mirrors .streamlit/config.toml)
          "theme.primaryColor": "#7461D4",
          "theme.backgroundColor": "#f5f5f7",
          "theme.secondaryBackgroundColor": "#ffffff",
          "theme.textColor": "#1d1d1f",
          "theme.linkColor": "#7461D4",
          "theme.borderColor": "#e1e1e6",
          "theme.baseRadius": "12px",
          "theme.font": "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif",
          "theme.codeFont": "'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace",
        },
      },
      document.getElementById("root"),
    );
  </script>
</body>
</html>
